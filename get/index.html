<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twist the Tiles – Get the game</title>
<meta name="description" content="A calm 3×3 puzzle: slide rows and columns to match the picture. Free on iPhone and iPad, or play in your browser.">
<meta property="og:title" content="Twist the Tiles 🧩">
<meta property="og:description" content="Slide rows and columns to match the picture. Can you beat my score?">
<meta property="og:image" content="https://twistthetiles.github.io/img/og.png">
<meta property="og:url" content="https://twistthetiles.github.io/get/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../img/favicon.png">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #120a33;
         color: #f1efff; font: 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; }
  a { color: #2fd8ff; }
</style>
<script>
  // One link for everyone who gets a shared result: each device goes to
  // the right store. Set PLAY_STORE_LIVE to true once the Android app is
  // public on Google Play.
  (function () {
    var PLAY_STORE_LIVE = false;
    var APP_STORE = 'https://apps.apple.com/app/id6825659378';
    var PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.twistthetiles.game';
    var WEB = 'https://twistthetiles.github.io/';
    var ua = navigator.userAgent || '';
    var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var android = /Android/.test(ua);
    var to = ios ? APP_STORE : (android && PLAY_STORE_LIVE ? PLAY_STORE : WEB);
    location.replace(to);
  })();
</script>
</head>
<body>
<p>Opening Twist the Tiles…<br><br>
<a href="https://apps.apple.com/app/id6825659378">App Store</a> ·
<a href="https://twistthetiles.github.io/play/">Play in your browser</a></p>
</body>
</html>
