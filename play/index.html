<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/play/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Play Twist the Tiles free in your browser: slide rows and columns to match the picture. 20 levels here, 100 in the free app.">
  <meta name="theme-color" content="#120a33">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Twist the Tiles">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Twist the Tiles – Play free in your browser</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0b0620; overflow: hidden; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: radial-gradient(circle at 50% 40%, #241656, #0b0620 70%);
      color: #f1efff; font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .4s;
    }
    #loading img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 10px 30px rgba(0,0,0,.5); animation: bob 1.4s ease-in-out infinite; }
    #loading .bar { width: 180px; height: 8px; border-radius: 4px; background: #2a1d5c; overflow: hidden; }
    #loading .bar i { display: block; width: 40%; height: 100%; border-radius: 4px; background: #2fd8ff; animation: slide 1.1s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-8px); } }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icons/Icon-192.png" alt="">
    <div>Loading Twist the Tiles…</div>
    <div class="bar"><i></i></div>
  </div>
  <script>
    // Short sound effects through Web Audio: decoded once, they play
    // instantly. (Plain <audio> lags on phones, and iPhone Safari blocks
    // sounds that don't start inside a tap.) The first tap unlocks it.
    window.__sfx = (function () {
      var ctx = null, buffers = {};
      function context() {
        if (!ctx) {
          var C = window.AudioContext || window.webkitAudioContext;
          if (!C) return null;
          ctx = new C();
        }
        return ctx;
      }
      return {
        load: function (name, url) {
          var c = context();
          if (!c) return;
          fetch(url).then(function (r) { return r.arrayBuffer(); })
            .then(function (data) {
              return new Promise(function (ok, fail) { c.decodeAudioData(data, ok, fail); });
            })
            .then(function (buffer) { buffers[name] = buffer; })
            .catch(function () {});
        },
        unlock: function () {
          var c = context();
          if (!c || c.state === 'running') return;
          c.resume();
          // iPhone also wants a sound started inside the tap.
          var s = c.createBufferSource();
          s.buffer = c.createBuffer(1, 1, 22050);
          s.connect(c.destination);
          s.start(0);
        },
        play: function (name, volume) {
          var b = buffers[name];
          if (!ctx || !b) return;
          if (ctx.state !== 'running') ctx.resume();
          var s = ctx.createBufferSource();
          s.buffer = b;
          var g = ctx.createGain();
          g.gain.value = volume;
          s.connect(g);
          g.connect(ctx.destination);
          s.start(0);
        }
      };
    })();
  </script>
  <script>
    // The game calls this once its home screen is ready, so players see
    // one loading screen. A fallback hides it if that never comes.
    window.__hideLoader = function () {
      var l = document.getElementById('loading');
      if (!l || l.dataset.hidden) return;
      l.dataset.hidden = '1';
      l.style.opacity = '0';
      setTimeout(function () { l.remove(); }, 450);
    };
    window.addEventListener('flutter-first-frame', function () {
      setTimeout(window.__hideLoader, 8000);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
